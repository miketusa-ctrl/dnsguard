# Public template. Replace every <PLACEHOLDER> with your own Cloudflare resource IDs
# (wrangler kv namespace create / wrangler d1 create). Rate-limit namespace IDs must be
# unique integers within your account. Secrets go in `wrangler secret put`, never here.

name = "dnsguard"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = false

[limits]
cpu_ms = 100

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt"]
fallthrough = true

[vars]
PUBLIC_LAUNCH = "true"
CHECK_LIMIT_PER_MIN = "20"
FREE_API = "true"
KEY_CHECK_LIMIT_PER_MIN = "120"
KEY_CHECK_LIMIT_PER_DAY = "1000"
PRO_CHECK_LIMIT_PER_MIN = "600"
PRO_CHECK_LIMIT_PER_DAY = "10000"
DAILY_CHECK_POOL = "8000"
DAILY_ANON_CHECK_POOL = "5000"
DAILY_WAITLIST_WRITES = "1000"
MCP_REGISTRY_AUTH = ""

[[unsafe.bindings]]
name = "CHECK_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_1>"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "WAITLIST_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_2>"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "KEY_CHECK_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_3>"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "PRO_CHECK_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_4>"
simple = { limit = 600, period = 60 }

[[unsafe.bindings]]
name = "RAPIDAPI_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_5>"
simple = { limit = 120, period = 60 }

[[kv_namespaces]]
binding = "WAITLIST"
id = "<KV_NAMESPACE_ID>"

[[kv_namespaces]]
binding = "KEYS"
id = "<KV_NAMESPACE_ID>"

[[kv_namespaces]]
binding = "LICENSES"
id = "<KV_NAMESPACE_ID>"
preview_id = "<KV_PREVIEW_NAMESPACE_ID>"

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "KeyQuota"

[[migrations]]
tag = "v1-keyquota-sqlite"
new_sqlite_classes = ["KeyQuota"]
